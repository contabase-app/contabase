name: Release Artifacts

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-artifacts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate public release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      publish_image: ${{ steps.version.outputs.publish_image }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate public version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "push" || "$REF_TYPE" != "tag" ]]; then
            echo "Release artifacts run only for tag pushes." >&2
            exit 1
          fi
          version="$REF_NAME"
          if [[ "$GIT_REF" != "refs/tags/$version" ]]; then
            echo "Workflow ref does not match the release tag." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid public Beta SemVer tag: $version" >&2
            exit 1
          fi

          snapshot_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$snapshot_version" != "$version" ]]; then
            echo "VERSION mismatch: snapshot=$snapshot_version requested=$version" >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse --verify -q "refs/tags/$version^{commit}")"; then
            echo "Release tag is unavailable in this checkout." >&2
            exit 1
          fi
          if ! workflow_commit="$(git rev-parse --verify -q "$WORKFLOW_SHA^{commit}")"; then
            echo "Workflow commit is unavailable in this checkout." >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$workflow_commit" ]]; then
            echo "Release tag does not point to the workflow commit." >&2
            exit 1
          fi

          remote_beta="$(git ls-remote --heads origin refs/heads/beta | awk '{print $1}')"
          if [[ -z "$remote_beta" || "$remote_beta" != "$tag_commit" ]]; then
            echo "origin/beta no longer points to the tagged commit." >&2
            exit 1
          fi

          preflight_run_id="$(
            gh api "repos/${REPOSITORY}/actions/runs?branch=beta&event=push&status=success&per_page=100" |
              jq -r --arg sha "$tag_commit" 'first(.workflow_runs[] | select(.name == "Release Preflight" and .head_sha == $sha and .conclusion == "success")) | .id // empty'
          )"
          if [[ -z "$preflight_run_id" ]]; then
            echo "No successful Release Preflight exists for $tag_commit." >&2
            exit 1
          fi
          echo "Release Preflight $preflight_run_id authorizes $tag_commit."

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "publish_image=true" >> "$GITHUB_OUTPUT"

  backup-restore-portability:
    name: Backup/restore portability (${{ matrix.stat_family }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            stat_family: GNU
          - os: macos-latest
            stat_family: BSD
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify native stat and SQLite
        run: |
          set -euo pipefail
          command -v stat
          command -v sqlite3

      - name: Run canonical backup/restore matrix
        run: ./scripts/tests/test_backup_restore_package.sh

  backup-restore-busybox:
    name: Backup/restore portability (BusyBox)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run canonical matrix on Alpine 3.21 without coreutils
        run: ./.github/scripts/run-backup-restore-busybox.sh

  artifacts:
    name: Build and validate Linux release artifacts
    needs:
      - prepare
      - backup-restore-portability
      - backup-restore-busybox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Run canonical release validation
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/release-validation.sh "$RELEASE_VERSION"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: contabase-release-${{ needs.prepare.outputs.version }}
          path: |
            release-dist/contabase-linux-amd64.tar.gz
            release-dist/contabase-linux-arm64.tar.gz
            release-dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preflight release state
        id: release-state
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          state_json="$(.github/scripts/release-state.sh "$RELEASE_VERSION" "${{ needs.prepare.outputs.commit }}" release-dist)"
          state_result=$?
          set -e
          if [[ "$state_result" -ne 0 ]]; then
            state="$(printf '%s\n' "$state_json" | jq -r '.state // "unknown"' 2>/dev/null || printf '%s' unknown)"
            reason="$(printf '%s\n' "$state_json" | jq -r '.reason // "release preflight failed"' 2>/dev/null || printf '%s' 'release preflight failed')"
            echo "Release preflight blocked: $state ($reason)" >&2
            exit 1
          fi
          state="$(printf '%s\n' "$state_json" | jq -er '.state')"
          upload_count="$(printf '%s\n' "$state_json" | jq -er '.upload | length')"
          {
            echo "state=$state"
            echo "upload_count=$upload_count"
            echo 'upload_files<<EOF'
            printf '%s\n' "$state_json" | jq -r '.upload[] | "release-dist/" + .'
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "Release state: $state; assets pending: $upload_count"
          case "$state" in
            missing|draft-compatible)
              echo "Proceeding with release asset attachment."
              ;;
            *)
              echo "Incompatible release state: $state"
              exit 1
              ;;
          esac

      - name: Attach assets to GitHub Release
        if: (steps.release-state.outputs.state == 'missing' || steps.release-state.outputs.state == 'draft-compatible') && steps.release-state.outputs.upload_count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          prerelease: true
          draft: true
          fail_on_unmatched_files: true
          files: ${{ steps.release-state.outputs.upload_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ghcr:
    name: Publish multi-arch image to GHCR
    needs:
      - prepare
      - artifacts
    if: needs.prepare.outputs.publish_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: ghcr.io/contabase-app/contabase:${{ needs.prepare.outputs.version }}
