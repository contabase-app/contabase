{{define "financial-emblem"}}
{{if .ProviderLogoPath}}
<img src="{{assetPath .ProviderLogoPath}}" alt="" class="institution-logo" data-avatar-fallback>
<span class="hidden font-bold uppercase tracking-wider select-none emblem-text emblem-len-{{len .ProviderMark}}" data-avatar-text>{{.ProviderMark}}</span>
{{else if .ProviderMark}}
<span class="font-bold uppercase tracking-wider select-none emblem-text emblem-len-{{len .ProviderMark}} cb-runtime-color-text" data-cb-color="{{.Color}}">{{.ProviderMark}}</span>
{{else}}
<i data-lucide="{{if .Icon}}{{.Icon}}{{else}}wallet{{end}}" class="h-4 w-4 icon-colored" data-cb-color="{{.Color}}"></i>
{{end}}
{{end}}
