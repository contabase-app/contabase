{{define "form-reembolso"}}
<link rel="stylesheet" href="{{assetPath "/assets/css/sheet-form.css"}}">
<div class="fixed inset-0 z-[100]">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" role="presentation"></div>
    <div class="absolute inset-x-0 bottom-0 flex justify-center overflow-hidden md:inset-0 md:items-center md:px-4 md:py-8">
        <section class="sheet-in sheet-shell relative flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden rounded-t-xl border md:rounded-xl" aria-labelledby="refund-title">
            <div class="sheet-drag mx-auto mt-4 h-1 w-10 rounded-full md:hidden"></div>
            <header class="sheet-topbar flex items-center gap-3 px-4 pb-3 pt-4 sm:px-6 md:pt-5">
                <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-emerald-500/10 text-[var(--cb-success)]">
                    <i data-lucide="undo-2" class="h-5 w-5"></i>
                </span>
                <div class="min-w-0 flex-1">
                    <h2 id="refund-title" class="text-base font-bold text-[var(--cb-text-main)]">Informar reembolso</h2>
                    <p class="truncate text-xs text-[var(--cb-text-muted)]">{{.TransactionLabel}}</p>
                </div>
                <button type="button" class="sheet-close-btn flex h-11 w-11 items-center justify-center rounded-full border" data-onclick="closeBottomSheet" aria-label="Fechar">
                    <i data-lucide="x" class="h-5 w-5"></i>
                </button>
            </header>
            <div class="min-h-0 flex-1 overflow-y-auto px-4 pb-5 pt-2 sm:px-6">
                <div class="mb-4 grid grid-cols-2 gap-3 rounded-xl border border-[var(--cb-border-subtle)] bg-[var(--cb-surface-2)] p-3 text-xs">
                    <div><span class="block text-[var(--cb-text-muted)]">Compra original</span><strong class="text-[var(--cb-text-main)]" data-sensitive>{{.OriginalAmount}}</strong></div>
                    <div class="text-right"><span class="block text-[var(--cb-text-muted)]">Disponível</span><strong class="text-[var(--cb-success)]" data-sensitive>{{.RemainingAmount}}</strong></div>
                </div>
                <form hx-post="/transacoes/{{.TransactionID}}/reembolso" hx-swap="none" hx-indicator="#htmx-indicator" class="sheet-form space-y-4">
                    <label class="block">
                        <span class="sheet-label mb-1.5 block">Valor reembolsado</span>
                        <input name="valor" type="text" inputmode="numeric" autocomplete="off" value="R$ {{.RemainingAmountInput}}" data-money-mask class="sheet-control h-14 w-full rounded-xl border px-4 text-lg font-bold outline-none" required autofocus>
                    </label>
                    <label class="block">
                        <span class="sheet-label mb-1.5 block">Descrição</span>
                        <input name="descricao" type="text" maxlength="240" placeholder="Ex: Estorno parcial da compra" class="sheet-control h-14 w-full rounded-xl border px-4 text-sm outline-none" required>
                    </label>
                    <p class="text-xs leading-relaxed text-[var(--cb-text-muted)]">O reembolso reduz a despesa e o saldo da fatura. Ele não será contabilizado como receita.</p>
                    <button type="submit" class="cb-button cb-button-primary btn-tactile flex h-12 w-full items-center justify-center gap-2 rounded-xl text-sm font-bold">
                        <i data-lucide="check" class="h-4 w-4"></i>
                        Registrar reembolso
                    </button>
                </form>
            </div>
        </section>
    </div>
</div>
{{end}}
